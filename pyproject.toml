[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "laya-top"
version = "0.1.0"
description = "A local-first process monitor with explainable tags and optional Laya intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Kamil Krawczyk"}]
keywords = ["process-monitor", "terminal", "tui", "macos", "linux", "coreml"]
dependencies = ["psutil>=7.0,<8", "textual>=6.0,<9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/bsisduck/laya-top"
Repository = "https://github.com/bsisduck/laya-top"
Issues = "https://github.com/bsisduck/laya-top/issues"
Documentation = "https://github.com/bsisduck/laya-top/blob/main/ARCHITECTURE.md"
Security = "https://github.com/bsisduck/laya-top/security/policy"
Changelog = "https://github.com/bsisduck/laya-top/blob/main/CHANGELOG.md"

[project.optional-dependencies]
laya = ["laya-coreml>=0.1,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
laya-top = "laya_top.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_top"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
