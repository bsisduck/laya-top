name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" --no-sync pytest -q

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --frozen --extra dev --python 3.12
      - name: Check code quality
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts
      - name: Build distributions
        run: uv build
      - name: Smoke-test the wheel in an isolated environment
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv /tmp/laya-top-wheel --python 3.12
          uv pip install --python /tmp/laya-top-wheel/bin/python "$wheel"
          /tmp/laya-top-wheel/bin/laya-top --version
          /tmp/laya-top-wheel/bin/laya-top --demo snapshot --count 1 > /tmp/laya-top.json
          /tmp/laya-top-wheel/bin/python -c 'import json; assert len(json.load(open("/tmp/laya-top.json"))["processes"]) == 1'
